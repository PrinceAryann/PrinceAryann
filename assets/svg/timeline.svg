<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Development journey timeline 2023 to future">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <style>
      .lbl{font-family:Inter,-apple-system,sans-serif;font-size:13.5px;fill:#A1A1AA;letter-spacing:0.2px}
      .yr{font-family:Inter,-apple-system,sans-serif;font-size:18px;font-weight:700;fill:#FAFAFA}
    </style>
  </defs>

  <rect width="1200" height="260" fill="#09090B"/>

  <!-- Animated flow line -->
  <line x1="80" y1="130" x2="1120" y2="130" stroke="url(#lineGrad)" stroke-width="2" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" values="0;-24" dur="2s" repeatCount="indefinite"/>
  </line>

  <!-- Node 1: 2023 -->
  <g transform="translate(130,130)">
    <circle r="9" fill="#3B82F6"><animate attributeName="r" values="7;10;7" dur="2.4s" repeatCount="indefinite"/></circle>
    <text class="yr" x="0" y="-24" text-anchor="middle">2023</text>
    <text class="lbl" x="0" y="42" text-anchor="middle">First lines of Python</text>
    <text class="lbl" x="0" y="60" text-anchor="middle">Discovered Linux</text>
  </g>

  <!-- Node 2: 2024 -->
  <g transform="translate(370,130)">
    <circle r="9" fill="#8B5CF6"><animate attributeName="r" values="7;10;7" dur="2.6s" repeatCount="indefinite"/></circle>
    <text class="yr" x="0" y="-24" text-anchor="middle">2024</text>
    <text class="lbl" x="0" y="42" text-anchor="middle">Full-stack foundations</text>
    <text class="lbl" x="0" y="60" text-anchor="middle">First OSS contributions</text>
  </g>

  <!-- Node 3: 2025 -->
  <g transform="translate(610,130)">
    <circle r="10" fill="#22D3EE"><animate attributeName="r" values="8;11;8" dur="2.2s" repeatCount="indefinite"/></circle>
    <text class="yr" x="0" y="-24" text-anchor="middle">2025</text>
    <text class="lbl" x="0" y="42" text-anchor="middle">Studying AI / ML</text>
    <text class="lbl" x="0" y="60" text-anchor="middle">Backend &amp; Automation</text>
  </g>

  <!-- Node 4: 2026 -->
  <g transform="translate(850,130)">
    <circle r="10" fill="#34D399"><animate attributeName="r" values="8;11;8" dur="2s" repeatCount="indefinite"/></circle>
    <text class="yr" x="0" y="-24" text-anchor="middle">2026</text>
    <text class="lbl" x="0" y="42" text-anchor="middle">Core CS &amp; Systems</text>
    <text class="lbl" x="0" y="60" text-anchor="middle">Applied ML Projects</text>
  </g>

  <!-- Node 5: Future -->
  <g transform="translate(1070,130)">
    <circle r="8" fill="none" stroke="#FAFAFA" stroke-width="1.5" stroke-dasharray="3 3">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="6s" repeatCount="indefinite"/>
    </circle>
    <text class="yr" x="0" y="-24" text-anchor="middle" opacity="0.85">Future</text>
    <text class="lbl" x="0" y="42" text-anchor="middle">Advanced Engineering</text>
    <text class="lbl" x="0" y="60" text-anchor="middle">Building at Scale</text>
  </g>
</svg>
