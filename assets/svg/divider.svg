<svg viewBox="0 0 1200 4" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#09090B" stop-opacity="0"/>
      <stop offset="20%" stop-color="#3B82F6" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#22D3EE" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#09090B" stop-opacity="0"/>
      <animate attributeName="x1" values="-20%;100%;-20%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="80%;200%;80%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="4" fill="url(#divGrad)"/>
</svg>
